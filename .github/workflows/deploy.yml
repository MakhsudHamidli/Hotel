name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare FTP target and server config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          host="${FTP_SERVER#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="${host%%:*}"
          dir="${FTP_SERVER_DIR:-public_html/}"
          [[ "$dir" != */ ]] && dir="$dir/"
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          echo "FTP_DIR=$dir" >> "$GITHUB_ENV"
          php -r 'echo "<?php\nreturn " . var_export(["admin_password" => (string)getenv("ADMIN_PASSWORD"), "admin_email" => (string)getenv("ADMIN_EMAIL")], true) . ";\n";' > config.local.php
          php -l config.local.php
          for f in api/*.php admin/*.php; do php -l "$f"; done

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_DIR }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            **/*.md
            data/*.sqlite*
            ADMIN_CREDENTIALS.txt
